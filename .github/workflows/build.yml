name: build android so

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .cargo/config.toml
      - .github/**
      - build_util/**
      - Cargo.*
      - crates/voicevox_core*/**
      - model/**
      - rust-toolchain
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            artifact_name: android-arm64
          - target: x86_64-linux-android
            artifact_name: android-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up ${{ matrix.target }}
        uses: ./.github/actions/rust-toolchain-from-file
        with:
          targets: ${{ matrix.target }}

      - name: Set path for android
        run: |
          echo "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "AR_${{ matrix.target }}=llvm-ar" >> "$GITHUB_ENV"

      - name: cache target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build voicevox_core_c_api
        run: |
          export VVCORE_BUILD_DOWNLOAD_AND_COPY_ORT=0
          cargo build -p voicevox_core_c_api -v --features load-onnxruntime --target ${{ matrix.target }} --profile c-api

      - name: Organize artifact
        run: |
          mkdir -p artifact
          cp -v target/${{ matrix.target }}/c-api/*voicevox_core.so artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voicevox_core-${{ matrix.artifact_name }}
          path: artifact/*voicevox_core.so
